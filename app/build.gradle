plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiaoyan.archive'
    compileSdk 34

    defaultConfig {
        applicationId "com.xiaoyan.archive"
        minSdk 26
        targetSdk 34
        // versionCode 跟随 GitHub Actions run number (build-N)，让 App 内部能比较版本
        // 本地构建默认 1，CI 构建会注入 GITHUB_RUN_NUMBER
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.1.0"
        // 自动更新检查用的仓库（App 启动时 fetch releases/latest 比对版本号）
        buildConfigField "String", "GITHUB_OWNER", "\"xiaoyanuser1Q\""
        buildConfigField "String", "GITHUB_REPO", "\"xiaoyan-app\""
    }

    // AGP 8+ 默认禁用 BuildConfig 字段生成，需显式开启
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def ksFile = file("${projectDir}/release.keystore")
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
}
