name: Test Secret Reading

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Read secrets
        run: |
          echo "=== TEST_REAL (AES-GCM encrypted with pub key) ==="
          echo "Value: $TEST_REAL"
          echo "Length: ${#TEST_REAL}"
          echo ""
          echo "=== TEST_FAKE (plain base64, no encryption) ==="
          echo "Value: $TEST_FAKE"
          echo "Length: ${#TEST_FAKE}"
          echo ""
          echo "=== TEST_DOUBLE (double base64) ==="
          echo "Value: $TEST_DOUBLE"
          echo "Length: ${#TEST_DOUBLE}"
        env:
          TEST_REAL: ${{ secrets.TEST_REAL }}
          TEST_FAKE: ${{ secrets.TEST_FAKE }}
          TEST_DOUBLE: ${{ secrets.TEST_DOUBLE }}
