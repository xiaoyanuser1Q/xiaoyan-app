name: Test Secret Reading

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Read secrets
        run: |
          echo "=== TEST_REAL (NaCl SealedBox encrypted) ==="
          echo "Value: $TEST_REAL"
          echo "Length: ${#TEST_REAL}"
          echo ""
          echo "=== KEYSTORE_BASE64 (5944 char keystore base64) ==="
          echo "Length: ${#KEYSTORE_BASE64}"
          echo "First 80 chars: ${KEYSTORE_BASE64:0:80}"
          echo "Last 80 chars: ${KEYSTORE_BASE64: -80}"
        env:
          TEST_REAL: ${{ secrets.TEST_REAL }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
