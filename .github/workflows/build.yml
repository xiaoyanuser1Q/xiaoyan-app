name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest

      - name: Accept Android SDK licenses
        run: |
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android build dependencies
        run: |
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null

      - name: Setup Android env
        run: |
          echo "sdk.dir=$HOME/android-sdk" > local.properties
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.7/bin" >> $GITHUB_PATH
          $GITHUB_WORKSPACE/gradle-8.7/bin/gradle --version

      - name: Download release keystore if configured
        id: keystore_check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "Using release keystore"
          else
            echo "build_type=debug" >> $GITHUB_OUTPUT
            echo "No release keystore secret found, building debug-signed APK (installable, marked debug)"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore_check.outputs.build_type }}" = "release" ]; then
            gradle assembleRelease --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare artifact (固定文件名方便主站用 latest/download 链接)
        run: |
          mkdir -p artifacts
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found in build outputs"
            ls -la app/build/outputs/ 2>/dev/null || true
            exit 1
          fi
          # 固定文件名 xiaoyan-archive.apk，主站可用 releases/latest/download/xiaoyan-archive.apk 自动跟随
          cp "$APK" "artifacts/xiaoyan-archive.apk"
          ls -la artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyan-archive-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "星空小站 App v1.1.0 · 构建 #${{ github.run_number }}"
          files: artifacts/*.apk
          body: |
            ## 星空小站 Android App v1.1.0

            **构建号:** #${{ github.run_number }}
            **签名类型:** ${{ steps.keystore_check.outputs.build_type }}
            **触发方式:** ${{ github.event_name }}

            ### 安装方法
            1. 点击下方 APK 下载
            2. 手机上点击 APK 文件安装
            3. 首次安装需允许「未知来源」（系统会弹提示）
            4. 打开 App → 输入账号登录即可使用

            ### 使用说明
            - **默认域名:** https://drugsthatthis.dpdns.org
            - **备用域名:** https://xiaoyan-archive.3394073613.workers.dev
            - 点右上角菜单 → 「切换服务器」可在两者间一键切换
            - 深色模式跟随系统设置
            - 后退键支持网页后退
            - 启动时自动检查新版本（fetch GitHub releases/latest，新版弹窗 + 24h 冷却）

            ### 升级覆盖安装
            - **build-3 用户**（debug 签名）：需先卸载旧版再安装新版（签名升级为 release，无法覆盖）
            - **build-9+ 用户**（release 签名）：可直接覆盖安装

          draft: false
          prerelease: false
